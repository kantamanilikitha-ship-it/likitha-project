<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders - Likitha Store</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo"><span>🛒</span><div>Likitha Store</div></a>
    <div class="nav-actions">
      <a href="/" class="nav-btn">🏠 Home</a>
      <a href="/cart" class="nav-btn cart-btn">🛒 Cart</a>
    </div>
  </div>
</nav>

<div class="section">
  <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:20px;color:var(--primary-dark)">📦 My Orders</h2>
  <div id="ordersContainer">
    <div style="text-align:center;padding:40px;color:#999">Loading orders...</div>
  </div>
</div>

<script>
async function loadOrders() {
  const res = await fetch('/api/orders/user/mine');
  const data = await res.json();
  const container = document.getElementById('ordersContainer');

  if (!data.success) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔐</div>
        <h3>Please login to view orders</h3>
        <a href="/login" style="display:inline-block;margin-top:15px;background:var(--primary);color:white;padding:10px 25px;border-radius:8px;font-weight:600">Login</a>
      </div>`;
    return;
  }

  if (!data.orders.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h3>No orders yet</h3>
        <p>Start shopping to see your orders here</p>
        <a href="/" style="display:inline-block;margin-top:15px;background:var(--primary);color:white;padding:10px 25px;border-radius:8px;font-weight:600">Shop Now</a>
      </div>`;
    return;
  }

  const statusColors = { pending: 'status-pending', confirmed: 'status-confirmed', delivered: 'status-delivered', cancelled: 'status-cancelled' };

  container.innerHTML = data.orders.map(order => `
    <div style="background:white;border-radius:10px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="font-weight:700;font-size:1.1rem">Order #${order.id}</div>
          <div style="color:var(--text-light);font-size:0.85rem">${new Date(order.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <div style="display:flex;align-items:center;gap:15px">
          <span class="status-badge ${statusColors[order.status] || 'status-pending'}">${order.status.toUpperCase()}</span>
          <span style="font-size:1.2rem;font-weight:700;color:var(--primary-dark)">₹${order.total.toFixed(2)}</span>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:0.9rem;color:var(--text-light)">
        <span>📍 ${order.address}</span> &nbsp;|&nbsp; <span>💳 ${order.payment_method.toUpperCase()}</span>
      </div>
    </div>
  `).join('');
}

loadOrders();
</script>
</body>
</html>
