<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - Likitha Store</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo"><span>🛒</span><div>Likitha Store</div></a>
    <div class="nav-actions">
      <a href="/cart" class="nav-btn">← Back to Cart</a>
    </div>
  </div>
</nav>

<div style="max-width:900px;margin:20px auto;padding:0 20px">
  <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:20px;color:var(--primary-dark)">📦 Checkout</h2>
</div>

<div class="checkout-container">
  <div class="checkout-form">
    <div class="form-title">📍 Delivery Details</div>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="name" placeholder="Enter your full name"/>
    </div>
    <div class="form-group">
      <label>Email Address *</label>
      <input type="email" id="email" placeholder="your@email.com"/>
    </div>
    <div class="form-group">
      <label>Phone Number *</label>
      <input type="tel" id="phone" placeholder="+91 98765 43210"/>
    </div>
    <div class="form-group">
      <label>Delivery Address *</label>
      <textarea id="address" placeholder="House No., Street, Area, City, Pincode"></textarea>
    </div>

    <div class="form-title" style="margin-top:25px">💳 Payment Method</div>
    <div class="payment-options">
      <label class="payment-option selected" id="cod-option">
        <input type="radio" name="payment" value="cod" checked onchange="selectPayment(this)"/>
        <span>💵</span>
        <div>
          <div style="font-weight:600">Cash on Delivery</div>
          <div style="font-size:0.8rem;color:var(--text-light)">Pay when your order arrives</div>
        </div>
      </label>
      <label class="payment-option" id="upi-option">
        <input type="radio" name="payment" value="upi" onchange="selectPayment(this)"/>
        <span>📱</span>
        <div>
          <div style="font-weight:600">UPI Payment</div>
          <div style="font-size:0.8rem;color:var(--text-light)">Pay via UPI (GPay, PhonePe, Paytm)</div>
        </div>
      </label>
    </div>

    <button class="btn-place-order" onclick="placeOrder()">✅ Place Order</button>
  </div>

  <div>
    <div class="cart-summary">
      <div class="summary-title">🛒 Order Summary</div>
      <div id="orderItems" style="margin-bottom:15px;max-height:300px;overflow-y:auto"></div>
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="summary-row"><span>Delivery</span><span id="delivery">FREE</span></div>
      <div class="summary-row summary-total"><span>Total</span><span id="total">₹0</span></div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal" style="display:none">
  <div class="modal" style="text-align:center">
    <div style="font-size:4rem;margin-bottom:15px">🎉</div>
    <h2 style="color:var(--primary-dark);margin-bottom:10px">Order Placed!</h2>
    <p style="color:var(--text-light);margin-bottom:5px">Your order has been placed successfully.</p>
    <p style="font-weight:600;margin-bottom:20px">Order ID: <span id="orderId" style="color:var(--primary)"></span></p>
    <p style="font-size:0.9rem;color:var(--text-light);margin-bottom:20px">We'll deliver your order soon. Thank you for shopping with us! 🙏</p>
    <a href="/" style="display:inline-block;background:var(--primary);color:white;padding:12px 30px;border-radius:8px;font-weight:600">Continue Shopping</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function selectPayment(radio) {
  document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
  radio.closest('.payment-option').classList.add('selected');
}

async function loadCart() {
  const res = await fetch('/api/cart');
  const data = await res.json();

  if (!data.cart.length) { window.location = '/cart'; return; }

  const total = parseFloat(data.total);
  const delivery = total >= 299 ? 0 : 40;

  document.getElementById('subtotal').textContent = `₹${total.toFixed(2)}`;
  document.getElementById('delivery').textContent = delivery === 0 ? 'FREE 🎉' : `₹${delivery}`;
  document.getElementById('total').textContent = `₹${(total + delivery).toFixed(2)}`;

  document.getElementById('orderItems').innerHTML = data.cart.map(item => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.9rem">
      <span>${item.name} × ${item.quantity}</span>
      <span style="font-weight:600">₹${(item.price * item.quantity).toFixed(2)}</span>
    </div>
  `).join('');
}

async function loadUserInfo() {
  const res = await fetch('/api/auth/me');
  const data = await res.json();
  if (data.user) {
    document.getElementById('name').value = data.user.name || '';
    document.getElementById('email').value = data.user.email || '';
    document.getElementById('phone').value = data.user.phone || '';
    document.getElementById('address').value = data.user.address || '';
  }
}

async function placeOrder() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

  if (!name || !email || !phone || !address) {
    showToast('Please fill all required fields', 'error');
    return;
  }

  const btn = document.querySelector('.btn-place-order');
  btn.textContent = 'Placing Order...';
  btn.disabled = true;

  const res = await fetch('/api/orders/place', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, phone, address, paymentMethod })
  });

  const data = await res.json();
  btn.disabled = false;
  btn.textContent = '✅ Place Order';

  if (data.success) {
    document.getElementById('orderId').textContent = `#${data.orderId}`;
    document.getElementById('successModal').style.display = 'flex';
  } else {
    showToast(data.message || 'Failed to place order', 'error');
  }
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadCart();
loadUserInfo();
</script>
</body>
</html>
