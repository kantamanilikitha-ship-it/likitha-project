<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cart - Likitha Store</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo"><span>🛒</span><div>Likitha Store</div></a>
    <div class="nav-actions">
      <a href="/" class="nav-btn">🏠 Home</a>
      <a href="/cart" class="nav-btn cart-btn">🛒 Cart <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</nav>

<div style="max-width:1100px;margin:20px auto;padding:0 20px">
  <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:20px;color:var(--primary-dark)">🛒 My Shopping Cart</h2>
</div>

<div class="cart-container" id="cartContainer">
  <div class="cart-items" id="cartItems">
    <div style="text-align:center;padding:40px;color:#999">Loading cart...</div>
  </div>
  <div class="cart-summary" id="cartSummary" style="display:none">
    <div class="summary-title">Order Summary</div>
    <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
    <div class="summary-row"><span>Delivery</span><span id="delivery">FREE</span></div>
    <div class="summary-row summary-total"><span>Total</span><span id="total">₹0</span></div>
    <button class="btn-checkout" onclick="window.location='/checkout'">Proceed to Checkout →</button>
    <a href="/" style="display:block;text-align:center;margin-top:12px;color:var(--primary);font-size:0.9rem">← Continue Shopping</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function loadCart() {
  const res = await fetch('/api/cart');
  const data = await res.json();
  document.getElementById('cartCount').textContent = data.count;

  const itemsDiv = document.getElementById('cartItems');
  const summaryDiv = document.getElementById('cartSummary');

  if (!data.cart.length) {
    itemsDiv.innerHTML = `
      <div class="empty-state">
        <div class="icon">🛒</div>
        <h3>Your cart is empty</h3>
        <p>Add some products to get started</p>
        <a href="/" style="display:inline-block;margin-top:15px;background:var(--primary);color:white;padding:10px 25px;border-radius:8px;font-weight:600">Shop Now</a>
      </div>`;
    summaryDiv.style.display = 'none';
    return;
  }

  summaryDiv.style.display = 'block';
  const total = parseFloat(data.total);
  const delivery = total >= 299 ? 0 : 40;

  document.getElementById('subtotal').textContent = `₹${total.toFixed(2)}`;
  document.getElementById('delivery').textContent = delivery === 0 ? 'FREE 🎉' : `₹${delivery}`;
  document.getElementById('total').textContent = `₹${(total + delivery).toFixed(2)}`;

  itemsDiv.innerHTML = `
    <h3 style="margin-bottom:15px;font-size:1.1rem">${data.cart.length} item(s) in cart</h3>
    ${data.cart.map(item => `
      <div class="cart-item" id="item-${item.productId}">
        <div class="cart-item-img">📦</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">₹${item.price} × ${item.quantity} = <strong>₹${(item.price * item.quantity).toFixed(2)}</strong></div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateQty(${item.productId}, ${item.quantity - 1})">−</button>
            <span class="qty-num">${item.quantity}</span>
            <button class="qty-btn" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeItem(${item.productId})" title="Remove">🗑️</button>
      </div>
    `).join('')}
  `;
}

async function updateQty(productId, quantity) {
  const res = await fetch('/api/cart/update', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ productId, quantity })
  });
  const data = await res.json();
  if (data.success) loadCart();
}

async function removeItem(productId) {
  await fetch(`/api/cart/remove/${productId}`, { method: 'DELETE' });
  showToast('Item removed');
  loadCart();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadCart();
</script>
</body>
</html>
